<!--
  A company page top card, captured 2026-08-09 and rewritten.

  Company pages never made the move to the server-driven markup: no
  componentkey, no data-testid, hashed Ember classes. `org-top-card` survived
  and is the anchor. The posts below the card are ordinary feed posts with
  real activity urns, which is why only the header is read here.
-->
<main>
  <section class="org-top-card artdeco-card ember-view">
    <img alt="Example Corp logo" src="https://media.example.com/logo.png" />
    <h1><span>Example Corp</span></h1>
    <div><span>Software Development</span></div>
    <div><span>Redmond, Washington</span></div>
    <div><span>29M followers</span></div>
    <div><span>10K+ employees</span></div>
    <div><span>Ranked on LinkedIn Top Companies</span></div>
    <div><span>Learn more</span></div>
    <button>Following</button>
  </section>
</main>

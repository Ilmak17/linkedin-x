<!--
  The "grow your network" suggestions, captured 2026-08-09 and rewritten with
  invented people.

  A person card has no componentkey and no data-testid, and every class is a
  hash, so the card is found by walking up from LinkedIn's own Connect button
  to the nearest ancestor that also holds a profile link. Identity is the /in/
  slug, which is the only stable unique thing on the card.
-->

    </div>
